name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, not one per suite: the image build is the expensive step, and
  # splitting per suite would rebuild it each time. Everything runs inside the
  # project's own images so CI executes the same environment as dev and prod —
  # a broken Dockerfile fails here rather than at deploy.
  checks:
    runs-on: ubuntu-latest
    env:
      # Only needed for compose interpolation; nothing here talks to Telegram.
      TELEGRAM_BOT_TOKEN: ci-dummy
      SCRAPE_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev images
        run: docker compose build

      - name: Backend tests
        run: docker compose run --rm api pytest -q

      - name: Notifier tests
        run: docker compose run --rm notifier pytest -q

      - name: Frontend typecheck and lint
        run: docker compose run --rm frontend sh -c "npx tsc --noEmit && npm run lint"

      # The prod frontend target runs `next build`, which the dev target never
      # does — that is where a real build break would otherwise hide until
      # deploy day.
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
