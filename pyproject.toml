[project]
name = "outlet-monitor"
version = "0.1.0"
description = "Lenovo Brazil outlet laptop price monitor"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# The notifier is a separate service with its own dependencies and its own
# pytest.ini; a bare `pytest` here must not try to collect its suite, since
# this environment has no pydantic/telegram. Run that one with
# `docker compose run --rm notifier pytest -q`.
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
