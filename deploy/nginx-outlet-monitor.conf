# Third server block for /etc/nginx/sites-available/murilopreto.com.br
# (appended alongside the existing :80 redirect and :443 default-homepage
# blocks — reuses the same certbot-issued cert, since it already covers
# both murilopreto.com.br and www.murilopreto.com.br).
#
# Proxies to the outlet-monitor frontend container, which docker-compose.prod.yml
# publishes to 127.0.0.1:3001 only (never directly reachable from the internet).
# (Not 7716 — this `listen 7716` directive itself binds the wildcard address,
# which already covers 127.0.0.1:7716, so Docker can't also bind that.)

server {
    listen 7716 ssl;
    http2 on;
    server_name murilopreto.com.br www.murilopreto.com.br;

    ssl_certificate /etc/letsencrypt/live/murilopreto.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murilopreto.com.br/privkey.pem;

    # Next.js compresses its own HTML and static chunks, but *not* Route
    # Handler responses — so /api/products went over the wire at 205 KB
    # uncompressed where gzip takes it to 15 KB. gzip_proxied defaults to
    # `off`, which disables compression for proxied responses entirely, so a
    # global `gzip on` in nginx.conf is not enough on its own; both directives
    # are needed here.
    gzip on;
    gzip_proxied any;
    gzip_types application/json text/csv text/plain text/css application/javascript;
    gzip_min_length 1024;

    # Content-hashed filenames, so they can never go stale.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        # Default is HTTP/1.0, which opens a fresh upstream connection per
        # request and buffers chunked responses — the CSV export streams.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
